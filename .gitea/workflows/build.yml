name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/soul-root-ca.crt

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: soul-node:22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Debug artifact runtime
        run: |
          echo "ACTIONS_RESULTS_URL=$ACTIONS_RESULTS_URL"
          echo "ACTIONS_RUNTIME_URL=$ACTIONS_RUNTIME_URL"
          echo "GITHUB_SERVER_URL=$GITHUB_SERVER_URL"
          echo "GITEA_SERVER_URL=$GITEA_SERVER_URL"

      - name: Test Actions Results endpoint
        shell: sh
        run: |
          echo "Testing $ACTIONS_RESULTS_URL"
          wget -S -O /dev/null "$ACTIONS_RESULTS_URL" || true
          
      - name: Package VSIX
        id: package
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VSIX="aoh-solution-explorer-${VERSION}.vsix"

          npx @vscode/vsce package -o "$VSIX"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: aoh-solution-explorer-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error