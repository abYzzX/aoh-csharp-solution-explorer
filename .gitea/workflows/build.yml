name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/soul-root-ca.crt

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: soul-node:22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        id: package
        shell: bash
        run: |
          NAME="$(node -p "require('./package.json').name")"
          DISPLAY_NAME="$(node -p "require('./package.json').displayName")"
          VERSION="$(node -p "require('./package.json').version")"

          VSIX="${NAME}-${VERSION}.vsix"

          npx @vscode/vsce package -o "$VSIX"

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "display_name=$DISPLAY_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      # Praktisch für CI-Builds / Pull Requests
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error

      # Release nur bei Push auf master.
      # Pull Requests sollen schließlich nicht plötzlich Releases produzieren.
      - name: Create Gitea Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: release
        shell: bash
        env:
          AOH_GITEA_TOKEN: ${{ secrets.AOH_GITEA_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
          DISPLAY_NAME: ${{ steps.package.outputs.display_name }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          set -euo pipefail

          API="$GITHUB_SERVER_URL/api/v1"
          REPO="$GITHUB_REPOSITORY"

          echo "Creating release $TAG"

          PAYLOAD="$(node -e '
            process.stdout.write(JSON.stringify({
              tag_name: process.env.TAG,
              target_commitish: process.env.GITHUB_SHA,
              name: `${process.env.DISPLAY_NAME} ${process.env.VERSION}`,
              body: `Release ${process.env.TAG}`,
              draft: false,
              prerelease: false
            }));
          ')"

          RESPONSE="$(
            curl --fail-with-body \
              -X POST \
              -H "Authorization: token $AOH_GITEA_TOKEN" \
              -H "Content-Type: application/json" \
              "$API/repos/$REPO/releases" \
              -d "$PAYLOAD"
          )"

          RELEASE_ID="$(
            printf '%s' "$RESPONSE" |
              node -e '
                let input = "";
                process.stdin.on("data", chunk => input += chunk);
                process.stdin.on("end", () => {
                  const response = JSON.parse(input);
                  process.stdout.write(String(response.id ?? ""));
                });
              '
          )"

          if [ -z "$RELEASE_ID" ]; then
            echo "Could not determine release ID."
            echo "$RESPONSE"
            exit 1
          fi

          echo "Created release ID $RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX to Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        env:
          AOH_GITEA_TOKEN: ${{ secrets.AOH_GITEA_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          VSIX: ${{ steps.package.outputs.vsix }}
        run: |
          set -euo pipefail

          API="$GITHUB_SERVER_URL/api/v1"
          REPO="$GITHUB_REPOSITORY"

          echo "Uploading $VSIX to release $RELEASE_ID"

          curl --fail-with-body \
            -X POST \
            -H "Authorization: token $AOH_GITEA_TOKEN" \
            -F "attachment=@$VSIX" \
            "$API/repos/$REPO/releases/$RELEASE_ID/assets?name=$VSIX"

          echo
          echo "Release asset uploaded successfully."